name: Claude Code Mention (reusable)

on:
  workflow_call:
    inputs:
      aws_role_arn:
        description: 'IAM role ARN to assume via OIDC for Bedrock InvokeModel'
        type: string
        required: true
      aws_region:
        description: 'AWS region for Bedrock'
        type: string
        default: 'us-east-1'
      bedrock_model_id:
        description: 'Bedrock model ID. Cross-region inference profiles recommended.'
        type: string
        default: 'us.anthropic.claude-sonnet-4-6'
      max_output_tokens:
        description: 'Cap on output tokens per model call. Bedrock reserves (input + max_tokens) up front. Higher than review since mentions may write code. Claude 3.7+ output burns at 5x.'
        type: string
        default: '32000'
      extra_prompt:
        description: 'Repo-specific extra context (rarely used in mention mode; user-driven)'
        type: string
        default: ''
      claude_args_extra:
        description: 'Extra CLI flags appended to claude_args'
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write   # required for OIDC AssumeRoleWithWebIdentity
  actions: read     # so Claude can read CI run logs when asked

jobs:
  claude:
    # Only fire when the triggering event body contains @claude.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.2.2
        with:
          fetch-depth: 1
      - uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: claude-mention-${{ github.run_id }}
      - uses: anthropics/claude-code-action@v1
        with:
          use_bedrock: 'true'
          # Cap output tokens: Bedrock reserves (input + max_tokens) against the
          # TPM/TPD quota at request start. See AWS Bedrock token burndown docs.
          settings: |
            { "env": { "CLAUDE_CODE_MAX_OUTPUT_TOKENS": "${{ inputs.max_output_tokens }}" } }
          claude_args: |
            --model ${{ inputs.bedrock_model_id }}
            ${{ inputs.claude_args_extra }}
