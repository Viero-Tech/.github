name: CI - Prisma
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '9'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma validate
      - run: pnpm prisma generate

  # Single aggregator check the org ruleset can require uniformly across
  # all reusable-ci-* workflows. Caller convention: name the calling job
  # `ci`, so this surfaces as `ci / ci-summary` on the PR.
  ci-summary:
    if: always()
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all CI jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::At least one required CI job failed or was cancelled"
            exit 1
          fi
          echo "All CI jobs passed."
