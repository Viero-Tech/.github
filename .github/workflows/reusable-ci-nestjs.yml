            chmod 600 ~/.ssh/submodule_key
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/submodule_key -o StrictHostKeyChecking=no"
          fi
          git submodule update --init --recursive
      # A repository that pins neither `packageManager` nor this input would make
      # pnpm/action-setup throw "No pnpm version is specified" and take its whole CI
      # with it. An empty output is read as unset by the action, which is what lets
      # `packageManager` win without tripping its "Multiple versions of pnpm
      # specified" check.
      #
      # The fallback reaches an absent field and an absent package.json, and nothing
      # else. The action re-reads package.json itself and its catch swallows only
      # ENOENT, so a file that does not parse, or a `packageManager` naming another
      # package manager, fails at setup whatever this step emits. That is by design:
      # both are repository defects that a CI fallback should not paper over.
      #
      # TRANSITIONAL. Pinning a major in a workflow is the thing standard 09 C8 and
      # standard 11 P1 forbid, and this branch exists only because seven callers pin
      # no `packageManager` and would otherwise lose CI outright: fleet-cards-fe,
      # generalized-platform-be, idp-fe, unigaz-driver-be, unigaz-platform-be,
      # unigaz-platform-fe, viero-site. Once every caller pins the field, delete the
      # branch and let this step fail instead of falling back.
      - name: Resolve pnpm version
        id: pnpm
        env:
          REQUESTED: ${{ inputs.pnpm-version }}
        run: |
          node -e '
            const fs = require("fs");
            const requested = process.env.REQUESTED || "";
            let resolved = requested;
            let warn = "";
            if (!requested) {
