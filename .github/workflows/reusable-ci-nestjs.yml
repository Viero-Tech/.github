          '
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.pnpm.outputs.version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@viero-tech'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ inputs.prisma-generate }}
        run: pnpm prisma generate
      - name: OpenAPI gate
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['openapi:gate'] ? 0 : 1)"; then
            pnpm run openapi:gate
          else
            echo "no openapi:gate script in package.json, step skipped"
          fi
      - name: Error code contract
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['check:error-codes'] ? 0 : 1)"; then
            pnpm run check:error-codes
          else
            echo "no check:error-codes script in package.json, step skipped"
          fi
      # Standard 07 S12 makes drift one package script: it regenerates the document
      # and fails on any diff against the committed copy. The script owns the path,
      # so the workflow neither knows nor needs it.
      - name: Committed specification drift
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['openapi:check'] ? 0 : 1)"; then
            pnpm run openapi:check
          else
            echo "no openapi:check script in package.json, step skipped"
          fi

  # Opt-in. knip and madge are selected by reading the dev dependency rather
  # than by trying the binary, so a missing tool is skipped and a real finding
  # still fails the job.
  hygiene:
    if: ${{ inputs.run-hygiene }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Stray lockfiles
        # Runs before any install: a committed npm or yarn lockfile means two
        # resolvers disagree about the tree, and pnpm is the only one this
        # organization installs with.
        run: |
          STRAY=""
          for lockfile in package-lock.json yarn.lock; do
            if [ -e "$lockfile" ]; then
              STRAY="$STRAY $lockfile"
            fi
          done
          if [ -n "$STRAY" ]; then
            echo "::error::a non-pnpm lockfile is committed:$STRAY"
            exit 1
          fi
          echo "no npm or yarn lockfile present"
      - name: Init submodules
        if: ${{ inputs.submodules != 'false' && inputs.submodules != '' }}
        env:
          SUBMODULE_SSH_KEY: ${{ secrets.ssh-key }}
        run: |
          if [ -n "$SUBMODULE_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            printf '%s\n' "$SUBMODULE_SSH_KEY" > ~/.ssh/submodule_key
            chmod 600 ~/.ssh/submodule_key
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/submodule_key -o StrictHostKeyChecking=no"
          fi
