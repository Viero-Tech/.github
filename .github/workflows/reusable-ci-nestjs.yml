name: CI - NestJS
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22'
      pnpm-version:
        # Pass an empty string ('') to opt out of version pinning and let
        # pnpm/action-setup resolve from the repo's `packageManager` field
        # in package.json. Required for repos pinning a pnpm major other
        # than 9 (e.g. fleet-cards-be uses pnpm@10).
        type: string
        default: '9'
      submodules:
        # Passed verbatim to actions/checkout. Set to 'recursive' for repos
        # that consume git submodules (e.g. fleet-cards-be has
        # prisma/idp-views/ as a submodule of Viero-Tech/idp-prisma).
        type: string
        default: 'false'
      prisma-generate:
        # Set true for Prisma repos: runs `pnpm prisma generate` after
        # install in typecheck + test jobs. Required when the source tree
        # imports from `generated/prisma/client` (or any Prisma-emitted
        # output path) because the generated client is not committed.
        type: boolean
        default: false
    secrets:
      ssh-key:
        # SSH private key for cloning private submodules from a DIFFERENT
        # repo in the same org. The default GITHUB_TOKEN is repo-scoped and
        # cannot clone other private repos, so submodule fetches across
        # repos fail with a 404 unless a credential is supplied. Pass the
        # private half of a read-only deploy key registered on the
        # submodule repo (e.g. Viero-Tech/idp-prisma).
        #
        # Must be passed as a SECRET, not an input. GitHub rejects
        # `${{ secrets.X }}` in `with:` blocks of reusable workflow calls
        # at parse time. Caller convention:
        #   with:
        #     submodules: 'recursive'
        #   secrets:
        #     ssh-key: ${{ secrets.IDP_PRISMA_DEPLOY_KEY }}
        # When omitted, actions/checkout falls back to the default token
        # (existing behavior for callers without cross-repo submodules).
        required: false

permissions:
  contents: read
  packages: read  # for private @viero-tech packages on GitHub Packages

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.2.2
        # No submodules + ssh-key here. actions/checkout uses a single
        # credential for both the parent fetch and submodule fetches —
        # incompatible with per-submodule deploy keys (the deploy key is
        # scoped to the submodule repo, not the parent). Parent stays on
        # GITHUB_TOKEN; submodules are initialised by the next step with
        # an explicit GIT_SSH_COMMAND.
      - name: Init submodules
        if: ${{ inputs.submodules != 'false' && inputs.submodules != '' }}
        env:
          SUBMODULE_SSH_KEY: ${{ secrets.ssh-key }}
        run: |
          if [ -n "$SUBMODULE_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            printf '%s\n' "$SUBMODULE_SSH_KEY" > ~/.ssh/submodule_key
            chmod 600 ~/.ssh/submodule_key
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/submodule_key -o StrictHostKeyChecking=no"
          fi
          git submodule update --init --recursive
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@viero-tech'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm eslint . --max-warnings=0 || true  # TODO: remove || true once repo lint is clean

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.2.2
        # No submodules + ssh-key here. actions/checkout uses a single
        # credential for both the parent fetch and submodule fetches —
        # incompatible with per-submodule deploy keys (the deploy key is
        # scoped to the submodule repo, not the parent). Parent stays on
        # GITHUB_TOKEN; submodules are initialised by the next step with
        # an explicit GIT_SSH_COMMAND.
      - name: Init submodules
        if: ${{ inputs.submodules != 'false' && inputs.submodules != '' }}
        env:
          SUBMODULE_SSH_KEY: ${{ secrets.ssh-key }}
        run: |
          if [ -n "$SUBMODULE_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            printf '%s\n' "$SUBMODULE_SSH_KEY" > ~/.ssh/submodule_key
            chmod 600 ~/.ssh/submodule_key
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/submodule_key -o StrictHostKeyChecking=no"
          fi
          git submodule update --init --recursive
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@viero-tech'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ inputs.prisma-generate }}
        run: pnpm prisma generate
      - run: pnpm tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.2.2
        # No submodules + ssh-key here. actions/checkout uses a single
        # credential for both the parent fetch and submodule fetches —
        # incompatible with per-submodule deploy keys (the deploy key is
        # scoped to the submodule repo, not the parent). Parent stays on
        # GITHUB_TOKEN; submodules are initialised by the next step with
        # an explicit GIT_SSH_COMMAND.
      - name: Init submodules
        if: ${{ inputs.submodules != 'false' && inputs.submodules != '' }}
        env:
          SUBMODULE_SSH_KEY: ${{ secrets.ssh-key }}
        run: |
          if [ -n "$SUBMODULE_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            printf '%s\n' "$SUBMODULE_SSH_KEY" > ~/.ssh/submodule_key
            chmod 600 ~/.ssh/submodule_key
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/submodule_key -o StrictHostKeyChecking=no"
          fi
          git submodule update --init --recursive
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@viero-tech'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ inputs.prisma-generate }}
        run: pnpm prisma generate
      - run: pnpm test -- --passWithNoTests

  # Single aggregator check the org ruleset can require uniformly across
  # all reusable-ci-* workflows. Caller convention: name the calling job
  # `ci`, so this surfaces as `ci / ci-summary` on the PR.
  ci-summary:
    if: always()
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all CI jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::At least one required CI job failed or was cancelled"
            exit 1
          fi
          echo "All CI jobs passed."
