              } else {
                resolved = "9";
                warn = "no pnpm packageManager field in package.json, falling back to pnpm 9. This fallback is transitional: pin packageManager to an exact version (standard 09 C8) so this repository controls its own pnpm major.";
              }
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "version=" + resolved + "\n");
            if (warn) { console.log("::warning::" + warn); }
          '
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.pnpm.outputs.version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@viero-tech'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ inputs.prisma-generate }}
        run: pnpm prisma generate
      # `pnpm test --passWithNoTests` meant two different things by pnpm major:
      # pnpm 9 rejected the flag with `Unknown option` before the suite ran, and
      # pnpm 10 forwarded it to the script's own command line. Selecting the
      # script by presence keeps one meaning on every version, and a failing
      # suite still fails the job.
      - name: Test
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:ci'] ? 0 : 1)"; then
            pnpm run test:ci
          else
            pnpm run test
          fi

  # Opt-in. Each script is optional and is selected by reading package.json,
  # so a repository without it skips the step while a failing script still
  # fails the job. A missing script is never reported as a pass.
  contract:
    if: ${{ inputs.run-contract }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No submodules + ssh-key here. actions/checkout uses a single
        # credential for both the parent fetch and submodule fetches,
        # incompatible with per-submodule deploy keys (the deploy key is
        # scoped to the submodule repo, not the parent). Parent stays on
        # GITHUB_TOKEN; submodules are initialised by the next step with
        # an explicit GIT_SSH_COMMAND.
      - name: Init submodules
        if: ${{ inputs.submodules != 'false' && inputs.submodules != '' }}
        env:
          SUBMODULE_SSH_KEY: ${{ secrets.ssh-key }}
        run: |
          if [ -n "$SUBMODULE_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            printf '%s\n' "$SUBMODULE_SSH_KEY" > ~/.ssh/submodule_key
