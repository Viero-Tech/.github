                resolved = "";
              } else {
                resolved = "9";
                warn = "no pnpm packageManager field in package.json, falling back to pnpm 9. This fallback is transitional: pin packageManager to an exact version (standard 09 C8) so this repository controls its own pnpm major.";
              }
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "version=" + resolved + "\n");
            if (warn) { console.log("::warning::" + warn); }
          '
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.pnpm.outputs.version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@viero-tech'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency audit
        # An accepted advisory belongs in the repository's own pnpm audit
        # configuration, where it is reviewable, rather than behind a flag here.
        run: pnpm audit --audit-level moderate
      - name: Dead code and unused dependencies
        run: |
          if node -e "process.exit(require('./package.json').devDependencies?.knip ? 0 : 1)"; then
            pnpm exec knip
          else
            echo "knip is not a dev dependency here, step skipped"
          fi
      - name: Circular dependencies
        run: |
          if node -e "process.exit(require('./package.json').devDependencies?.madge ? 0 : 1)"; then
            pnpm exec madge --circular src
          else
            echo "madge is not a dev dependency here, step skipped"
          fi

  # Single aggregator check the org ruleset can require uniformly across
  # all reusable-ci-* workflows. Caller convention: name the calling job
  # `ci`, so this surfaces as `ci / ci-summary` on the PR.
  ci-summary:
    if: always()
    # A job switched off by its input reports `skipped`, which is neither a
    # failure nor a cancellation, so an opt-in job that did not run leaves this
    # check exactly as it was.
    needs: [lint, typecheck, test, contract, hygiene]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all CI jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::At least one required CI job failed or was cancelled"
            exit 1
          fi
          echo "All CI jobs passed."
