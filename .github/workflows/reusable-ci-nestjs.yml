name: CI - NestJS
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22'
      pnpm-version:
        # Empty by default: pnpm/action-setup@v4 reads the version from the
        # `packageManager` field in the repository's package.json. Supplying a
        # version here as well makes the action fail with "Multiple versions of
        # pnpm specified", so set this only for a repository that pins no
        # `packageManager` field.
        type: string
        default: ''
      submodules:
        # Passed verbatim to actions/checkout. Set to 'recursive' for repos
        # that consume git submodules (e.g. fleet-cards-be has
        # prisma/idp-views/ as a submodule of Viero-Tech/idp-prisma).
        type: string
        default: 'false'
      prisma-generate:
        # Set true for Prisma repos: runs `pnpm prisma generate` after
        # install in typecheck + test jobs. Required when the source tree
        # imports from `generated/prisma/client` (or any Prisma-emitted
        # output path) because the generated client is not committed.
        type: boolean
        default: false
      run-contract:
        # Runs the API contract gates: the OpenAPI house gate, the error-code
        # contract and committed-specification drift. Off by default, so a
        # caller that has not adopted them keeps its current job list.
        type: boolean
        default: false
      run-hygiene:
        # Runs the hygiene gates: stray lockfiles, dependency audit, dead
        # code and circular imports. Off by default for the same reason.
        type: boolean
        default: false
    secrets:
      ssh-key:
        # SSH private key for cloning private submodules from a DIFFERENT
        # repo in the same org. The default GITHUB_TOKEN is repo-scoped and
        # cannot clone other private repos, so submodule fetches across
        # repos fail with a 404 unless a credential is supplied. Pass the
        # private half of a read-only deploy key registered on the
        # submodule repo (e.g. Viero-Tech/idp-prisma).
        #
        # Must be passed as a SECRET, not an input. GitHub rejects
        # `${{ secrets.X }}` in `with:` blocks of reusable workflow calls
        # at parse time. Caller convention:
        #   with:
        #     submodules: 'recursive'
        #   secrets:
        #     ssh-key: ${{ secrets.IDP_PRISMA_DEPLOY_KEY }}
        # When omitted, actions/checkout falls back to the default token
        # (existing behavior for callers without cross-repo submodules).
        required: false

permissions:
  contents: read
  packages: read  # for private @viero-tech packages on GitHub Packages

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No submodules + ssh-key here. actions/checkout uses a single
        # credential for both the parent fetch and submodule fetches —
        # incompatible with per-submodule deploy keys (the deploy key is
        # scoped to the submodule repo, not the parent). Parent stays on
        # GITHUB_TOKEN; submodules are initialised by the next step with
        # an explicit GIT_SSH_COMMAND.
      - name: Init submodules
        if: ${{ inputs.submodules != 'false' && inputs.submodules != '' }}
        env:
          SUBMODULE_SSH_KEY: ${{ secrets.ssh-key }}
        run: |
          if [ -n "$SUBMODULE_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            printf '%s\n' "$SUBMODULE_SSH_KEY" > ~/.ssh/submodule_key
            chmod 600 ~/.ssh/submodule_key
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/submodule_key -o StrictHostKeyChecking=no"
          fi
          git submodule update --init --recursive
      # A repository that pins neither `packageManager` nor this input would make
      # pnpm/action-setup throw "No pnpm version is specified" and take its whole CI
      # with it. An empty output is read as unset by the action, which is what lets
      # `packageManager` win without tripping its "Multiple versions of pnpm
      # specified" check.
      #
      # The fallback reaches an absent field and an absent package.json, and nothing
      # else. The action re-reads package.json itself and its catch swallows only
      # ENOENT, so a file that does not parse, or a `packageManager` naming another
      # package manager, fails at setup whatever this step emits. That is by design:
      # both are repository defects that a CI fallback should not paper over.
      #
      # TRANSITIONAL. Pinning a major in a workflow is the thing standard 09 C8 and
      # standard 11 P1 forbid, and this branch exists only because seven callers pin
      # no `packageManager` and would otherwise lose CI outright: fleet-cards-fe,
      # generalized-platform-be, idp-fe, unigaz-driver-be, unigaz-platform-be,
      # unigaz-platform-fe, viero-site. Once every caller pins the field, delete the
      # branch and let this step fail instead of falling back.
      - name: Resolve pnpm version
        id: pnpm
        env:
          REQUESTED: ${{ inputs.pnpm-version }}
        run: |
          node -e '
            const fs = require("fs");
            const requested = process.env.REQUESTED || "";
            let resolved = requested;
            let warn = "";
            if (!requested) {
              let pm = "";
              try {
                pm = JSON.parse(fs.readFileSync("package.json", "utf8")).packageManager;
              } catch (err) {
                pm = "";
              }
              if (typeof pm === "string" && pm.indexOf("pnpm@") === 0) {
                resolved = "";
              } else {
                resolved = "9";
                warn = "no pnpm packageManager field in package.json, falling back to pnpm 9. This fallback is transitional: pin packageManager to an exact version (standard 09 C8) so this repository controls its own pnpm major.";
              }
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "version=" + resolved + "\n");
            if (warn) { console.log("::warning::" + warn); }
          '
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.pnpm.outputs.version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@viero-tech'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # `pnpm exec`, not `pnpm eslint`: pnpm resolves a script name before a
      # binary, so a repository that later defines an `eslint` script would put
      # `--max-warnings=0` after a script name, which is the version-dependent
      # form this workflow exists to remove. `exec` always means the binary.
      - run: pnpm exec eslint . --max-warnings=0

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # No submodules + ssh-key here. actions/checkout uses a single
        # credential for both the parent fetch and submodule fetches —
        # incompatible with per-submodule deploy keys (the deploy key is
        # scoped to the submodule repo, not the parent). Parent stays on
        # GITHUB_TOKEN; submodules are initialised by the next step with
        # an explicit GIT_SSH_COMMAND.
