name: CI - Flutter
on:
  workflow_call:
    inputs:
      flutter-version:
        type: string
        default: '3.8.1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.2.2
      - uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          flutter-version: ${{ inputs.flutter-version }}
          cache: true
      - run: flutter pub get
      - run: dart analyze --fatal-warnings
      - run: dart format --set-exit-if-changed .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.2.2
      - uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          flutter-version: ${{ inputs.flutter-version }}
          cache: true
      - run: flutter pub get
      - run: flutter test

  # Single aggregator check the org ruleset can require uniformly across
  # all reusable-ci-* workflows. Caller convention: name the calling job
  # `ci`, so this surfaces as `ci / ci-summary` on the PR.
  ci-summary:
    if: always()
    needs: [analyze, test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all CI jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::At least one required CI job failed or was cancelled"
            exit 1
          fi
          echo "All CI jobs passed."
