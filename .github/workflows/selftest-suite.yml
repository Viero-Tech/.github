name: selftest-suite

# The body of selftest.yml: lints every workflow, unit-tests the shell logic
# they embed, and runs each shared workflow against the fixtures in
# .github/fixtures. A fixture named pass must end green; a fixture named
# fail-<kind> must end red with the matching job among the failed jobs.
# Reusable workflows cannot be called "expecting failure", so every fixture
# runs as its own caller job and the final ci-summary reads their results.

on:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release binary, checked against its published SHA-256, so no
      # third-party action has to be allowlisted. shellcheck ships on the runner.
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  script-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit-test the workflow shell logic
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyyaml==6.0.3
          "$RUNNER_TEMP/venv/bin/python" .github/selftest/test_workflow_scripts.py

  # A pull request that only touches documentation skips the fixture runs,
  # because the shared workflows would short-circuit them anyway.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Classify the change
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          docs_only=false
          if [ "$EVENT_NAME" = pull_request ]; then
            changed=$(git diff --name-only 'HEAD^1' HEAD)
            if [ -n "$changed" ]; then
              docs_only=true
              while IFS= read -r path; do
                case "$path" in
                  docs/*|*.md) ;;
                  *) docs_only=false; break ;;
                esac
              done <<< "$changed"
            fi
          fi
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"

  nestjs-pass:
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    uses: ./.github/workflows/ci-nestjs.yml
    with:
      working-directory: .github/fixtures/nestjs/pass
      prisma: true
      database: postgres
      database-port: '5433'
      redis: true
      migrate-script: db:migrate
      e2e: true
      contract: true
      env: |
        SELFTEST_ENV=present
        SELFTEST_EMPTY=

  nestjs-switched-off:
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    uses: ./.github/workflows/ci-nestjs.yml
    with:
      working-directory: .github/fixtures/nestjs/fail-test
      prisma: true
      test: false
      build: false

  nestjs-fail-lint:
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    uses: ./.github/workflows/ci-nestjs.yml
    with:
      working-directory: .github/fixtures/nestjs/fail-lint
      prisma: true

  nestjs-fail-type:
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    uses: ./.github/workflows/ci-nestjs.yml
    with:
      working-directory: .github/fixtures/nestjs/fail-type
      prisma: true

  nestjs-fail-test:
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    uses: ./.github/workflows/ci-nestjs.yml
    with:
      working-directory: .github/fixtures/nestjs/fail-test
      prisma: true

  nextjs-pass:
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    uses: ./.github/workflows/ci-nextjs.yml
    with:
      working-directory: .github/fixtures/nextjs/pass

  nextjs-fail-lint:
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    uses: ./.github/workflows/ci-nextjs.yml
    with:
      working-directory: .github/fixtures/nextjs/fail-lint

  nextjs-fail-type:
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    uses: ./.github/workflows/ci-nextjs.yml
    with:
      working-directory: .github/fixtures/nextjs/fail-type

  nextjs-fail-test:
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    uses: ./.github/workflows/ci-nextjs.yml
    with:
      working-directory: .github/fixtures/nextjs/fail-test

  prisma-pass:
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    uses: ./.github/workflows/ci-prisma.yml
    with:
      working-directory: .github/fixtures/prisma/pass

  prisma-fail-lint:
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    uses: ./.github/workflows/ci-prisma.yml
    with:
      working-directory: .github/fixtures/prisma/fail-lint

  prisma-fail-type:
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    uses: ./.github/workflows/ci-prisma.yml
    with:
      working-directory: .github/fixtures/prisma/fail-type

  prisma-fail-test:
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    uses: ./.github/workflows/ci-prisma.yml
    with:
      working-directory: .github/fixtures/prisma/fail-test

  python-pass:
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    uses: ./.github/workflows/ci-python.yml
    with:
      working-directory: .github/fixtures/python/pass
      mypy: true

  python-fail-lint:
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    uses: ./.github/workflows/ci-python.yml
    with:
      working-directory: .github/fixtures/python/fail-lint
      mypy: true

  python-fail-type:
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    uses: ./.github/workflows/ci-python.yml
    with:
      working-directory: .github/fixtures/python/fail-type
      mypy: true

  python-fail-test:
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    uses: ./.github/workflows/ci-python.yml
    with:
      working-directory: .github/fixtures/python/fail-test
      mypy: true

  flutter-pass:
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    uses: ./.github/workflows/ci-flutter.yml
    with:
      working-directory: .github/fixtures/flutter/pass
      flutter-version: '3.47.7'

  flutter-fail-lint:
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    uses: ./.github/workflows/ci-flutter.yml
    with:
      working-directory: .github/fixtures/flutter/fail-lint
      flutter-version: '3.47.7'

  flutter-fail-type:
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    uses: ./.github/workflows/ci-flutter.yml
    with:
      working-directory: .github/fixtures/flutter/fail-type
      flutter-version: '3.47.7'

  flutter-fail-test:
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    uses: ./.github/workflows/ci-flutter.yml
    with:
      working-directory: .github/fixtures/flutter/fail-test
      flutter-version: '3.47.7'

  # Each fixture line: caller job, its result, the job that must fail ('-'
  # for a pass fixture), and the failed jobs the shared workflow reported.
  ci-summary:
    if: always()
    needs: [actionlint, script-tests, changes, nestjs-pass, nestjs-switched-off, nestjs-fail-lint, nestjs-fail-type, nestjs-fail-test, nextjs-pass, nextjs-fail-lint, nextjs-fail-type, nextjs-fail-test, prisma-pass, prisma-fail-lint, prisma-fail-type, prisma-fail-test, python-pass, python-fail-lint, python-fail-type, python-fail-test, flutter-pass, flutter-fail-lint, flutter-fail-type, flutter-fail-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every fixture ended as designed
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
          TOOL_STATES: |
            actionlint ${{ needs.actionlint.result }}
            script-tests ${{ needs.script-tests.result }}
            changes ${{ needs.changes.result }}
          FIXTURE_STATES: |
            nestjs-pass ${{ needs.nestjs-pass.result }} - ${{ needs.nestjs-pass.outputs.failed-jobs }}
            nestjs-switched-off ${{ needs.nestjs-switched-off.result }} - ${{ needs.nestjs-switched-off.outputs.failed-jobs }}
            nestjs-fail-lint ${{ needs.nestjs-fail-lint.result }} lint ${{ needs.nestjs-fail-lint.outputs.failed-jobs }}
            nestjs-fail-type ${{ needs.nestjs-fail-type.result }} typecheck ${{ needs.nestjs-fail-type.outputs.failed-jobs }}
            nestjs-fail-test ${{ needs.nestjs-fail-test.result }} test ${{ needs.nestjs-fail-test.outputs.failed-jobs }}
            nextjs-pass ${{ needs.nextjs-pass.result }} - ${{ needs.nextjs-pass.outputs.failed-jobs }}
            nextjs-fail-lint ${{ needs.nextjs-fail-lint.result }} lint ${{ needs.nextjs-fail-lint.outputs.failed-jobs }}
            nextjs-fail-type ${{ needs.nextjs-fail-type.result }} typecheck ${{ needs.nextjs-fail-type.outputs.failed-jobs }}
            nextjs-fail-test ${{ needs.nextjs-fail-test.result }} test ${{ needs.nextjs-fail-test.outputs.failed-jobs }}
            prisma-pass ${{ needs.prisma-pass.result }} - ${{ needs.prisma-pass.outputs.failed-jobs }}
            prisma-fail-lint ${{ needs.prisma-fail-lint.result }} lint ${{ needs.prisma-fail-lint.outputs.failed-jobs }}
            prisma-fail-type ${{ needs.prisma-fail-type.result }} typecheck ${{ needs.prisma-fail-type.outputs.failed-jobs }}
            prisma-fail-test ${{ needs.prisma-fail-test.result }} test ${{ needs.prisma-fail-test.outputs.failed-jobs }}
            python-pass ${{ needs.python-pass.result }} - ${{ needs.python-pass.outputs.failed-jobs }}
            python-fail-lint ${{ needs.python-fail-lint.result }} lint ${{ needs.python-fail-lint.outputs.failed-jobs }}
            python-fail-type ${{ needs.python-fail-type.result }} typecheck ${{ needs.python-fail-type.outputs.failed-jobs }}
            python-fail-test ${{ needs.python-fail-test.result }} test ${{ needs.python-fail-test.outputs.failed-jobs }}
            flutter-pass ${{ needs.flutter-pass.result }} - ${{ needs.flutter-pass.outputs.failed-jobs }}
            flutter-fail-lint ${{ needs.flutter-fail-lint.result }} lint ${{ needs.flutter-fail-lint.outputs.failed-jobs }}
            flutter-fail-type ${{ needs.flutter-fail-type.result }} lint ${{ needs.flutter-fail-type.outputs.failed-jobs }}
            flutter-fail-test ${{ needs.flutter-fail-test.result }} test ${{ needs.flutter-fail-test.outputs.failed-jobs }}
        run: |
          set -euo pipefail
          bad=0
          while read -r job result; do
            [ -n "$job" ] || continue
            if [ "$result" != success ]; then
              echo "::error::$job finished with '$result'"
              bad=1
            fi
          done <<< "$TOOL_STATES"
          while read -r job result expected failed; do
            [ -n "$job" ] || continue
            if [ "$DOCS_ONLY" = true ]; then
              if [ "$result" != skipped ]; then
                echo "::error::$job should be skipped on a docs-only change, got '$result'"
                bad=1
              fi
            elif [ "$expected" = - ]; then
              if [ "$result" = success ]; then
                echo "$job: success, as designed"
              else
                echo "::error::$job should pass, got '$result' (failed jobs: ${failed:-none})"
                bad=1
              fi
            elif [ "$result" = failure ] && [[ " $failed " == *" $expected "* ]]; then
              echo "$job: failed in '$expected', as designed (failed jobs: $failed)"
            else
              echo "::error::$job should fail in '$expected', got '$result' (failed jobs: ${failed:-none})"
              bad=1
            fi
          done <<< "$FIXTURE_STATES"
          exit "$bad"
