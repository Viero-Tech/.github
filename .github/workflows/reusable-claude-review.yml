name: Claude Code Review (reusable)

on:
  workflow_call:
    inputs:
      extra_prompt:
        description: 'Repo-specific extra context appended to the review prompt'
        type: string
        default: ''
      skip_drafts:
        description: 'Skip auto-review on draft PRs'
        type: boolean
        default: true
      use_sticky_comment:
        description: 'Update one comment per PR instead of stacking new comments per push'
        type: boolean
        default: true
      claude_args_extra:
        description: 'Extra CLI flags appended to claude_args (e.g. --model claude-opus-4-7)'
        type: string
        default: ''
    secrets:
      claude_oauth_token:
        description: 'CLAUDE_CODE_OAUTH_TOKEN (org-level secret)'
        required: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

# One in-flight review per PR. New pushes cancel the prior in-progress review
# so we do not pile up reviews when a contributor pushes rapid-fire commits.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !inputs.skip_drafts || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.2.2
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.claude_oauth_token }}
          use_sticky_comment: ${{ inputs.use_sticky_comment }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request following the conventions documented in
            the CLAUDE.md file at the repo root. CLAUDE.md is the source of
            truth for code-review behavior on this repo.

            Format every comment as: problem (1 line) | why it matters (1 line) | suggested fix (code snippet).

            Severity scale (apply per CLAUDE.md):
              CRITICAL  : blocks merge
              IMPORTANT : warrants discussion before merging
              SUGGESTION: optional improvement

            Behavior rules:
              - Only flag issues you are certain about. When in doubt, stay silent.
              - Prefer fewer high-quality comments over comprehensive coverage.
              - Only comment on code changed or directly affected by this PR. Do not flag pre-existing issues.

            Do NOT flag (CI handles these):
              - Formatting, import order, unused variables (ESLint / ruff / dart analyze)
              - Type errors (TypeScript compiler / Dart analyzer fail CI on their own)
              - Test failures (Jest / pytest / flutter test reports them inline)

            Do NOT review (auto-generated paths declared in CLAUDE.md):
              - app/api-client/**, generated/**, *.generated.ts, prisma/client/**
              - Lock files (pnpm-lock.yaml, package-lock.json, pubspec.lock)
              - .env.example, Dockerfile (unless security-relevant)

            Use inline comments via the github_inline_comment MCP tool for
            specific issues. Use a top-level comment for the overall verdict.

            ${{ inputs.extra_prompt }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            ${{ inputs.claude_args_extra }}
