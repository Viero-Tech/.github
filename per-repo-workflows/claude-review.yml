name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

# Caller-side permissions: a reusable workflow's permissions cannot exceed
# what the caller grants. Org default is read-only, so we declare what the
# Bedrock + review-comment flow needs.
permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    uses: Viero-Tech/.github/.github/workflows/reusable-claude-review.yml@main
    with:
      aws_role_arn: ${{ vars.AWS_BEDROCK_ROLE_ARN }}
      aws_region: ${{ vars.AWS_BEDROCK_REGION }}
