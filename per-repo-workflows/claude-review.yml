name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

jobs:
  review:
    uses: Viero-Tech/.github/.github/workflows/reusable-claude-review.yml@main
    with:
      aws_role_arn: ${{ vars.AWS_BEDROCK_ROLE_ARN }}
      aws_region: ${{ vars.AWS_BEDROCK_REGION }}
