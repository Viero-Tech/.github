name: Claude Code Mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    uses: Viero-Tech/.github/.github/workflows/reusable-claude-mention.yml@main
    with:
      aws_role_arn: ${{ vars.AWS_BEDROCK_ROLE_ARN }}
      aws_region: ${{ vars.AWS_BEDROCK_REGION }}
