name: Claude Code Mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

# Caller-side permissions for the mention flow. Mention mode allows code
# edits when the user explicitly asks, so contents:write is included.
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    uses: Viero-Tech/.github/.github/workflows/reusable-claude-mention.yml@main
    with:
      aws_role_arn: ${{ vars.AWS_BEDROCK_ROLE_ARN }}
      aws_region: ${{ vars.AWS_BEDROCK_REGION }}
